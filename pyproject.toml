[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cwaves"
dynamic = ["version"]
description = "lib python to compute CWAVE parameters from SAR ocean cross-spectra (Schulz-Stellenfleth et al. 2007)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Antoine Grouazel", email = "antoine.grouazel@ifremer.fr" }]
keywords = [
  "sentinel1",
  "ocean",
  "waves",
  "cross-spectrum",
  "CWAVE",
  "SAR",
  "wavenumber",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"

dependencies = [
  "xarray",
  "numpy",
  "scipy",
  "h5netcdf",
  "h5py",
  "dask",
  "pyyaml",
  "matplotlib",
]

[project.optional-dependencies]
dev = [
  "bandit",
  "codespell",
  "mypy",
  "mypy-extensions",
  "pre-commit",
  "pytest",
  "ruff",
  "coverage",
  "coverage-badge",
  "pytest-cov",
]
docs = [
  "sphinx",
  "sphinx-rtd-theme",
  "matplotlib",
]

[project.urls]
repository = "https://github.com/s1tools/CWAVES"
homepage = "https://github.com/s1tools/CWAVES"
documentation = "https://cwaves.readthedocs.io"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "cwaves/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["cwaves"]

[tool.hatch.build.targets.sdist]
include = ["cwaves", "tests", "README.md", "assets"]


# ---------------- linters / formatters ----------------

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["cwaves", "tests"]
exclude = [
  ".git",
  ".mypy_cache",
  ".tox",
  ".venv",
  "_build",
  "build",
  "dist",
  "env",
  "venv",
  "_version.py",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = [
  "E203",  # whitespace before ':'
  "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# N803 (argument `cwave_Nk` / `cwave_Nphi`) and N806 (local `Gnk`, `Fnphi`,
# `Kernel`, `Cn`, ...) are kept on purpose : the public argument names are fixed
# by the conservativeness requirement on the `xsar_slc` API, and the local
# variable names mirror the notation of the reference paper (Schulz-Stellenfleth
# et al. 2007). See repository_specifications.md.
"cwaves/compute_cwaves.py" = ["N803", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
pretty = true
show_traceback = true
color_output = true
allow_redefinition = false
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
norecursedirs = ["hooks", "*.egg", ".eggs", "dist", "build", "docs", ".tox", ".git", "__pycache__", "assets"]
addopts = [
  "--strict-markers",
  "--tb=short",
]

[tool.coverage.run]
source = ["cwaves"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
