# Read the Docs configuration for CWAVES
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  # the PNG figures are committed in docs/figures/ (see docs/generate_figures.py)
  fail_on_warning: false
